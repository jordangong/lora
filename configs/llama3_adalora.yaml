# AdaLoRA (Adaptive Low-Rank Adaptation) configuration for Llama 3
# AdaLoRA dynamically allocates parameter budget based on importance scores
# Starts with higher rank and prunes to target rank during training

model:
  model_name_or_path: meta-llama/Meta-Llama-3-8B
  model_type: causal_lm
  torch_dtype: bfloat16
  trust_remote_code: false
  use_flash_attention_2: true
  load_in_4bit: false
  load_in_8bit: false

lora:
  method: adalora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  # AdaLoRA-specific settings
  init_r: 12
  target_r: 8
  tinit: 200
  tfinal: 1000
  deltaT: 10
  beta1: 0.85
  beta2: 0.85
  orth_reg_weight: 0.5

data:
  dataset_name: tatsu-lab/alpaca
  text_column: text
  max_seq_length: 2048
  preprocessing_num_workers: 4
  train_split: train
  # For loss-based eval during training, use one of these options:
  # Option 1: Split training data for validation loss
  eval_split_ratio: 0.05
  # Option 2: Use a separate holdout dataset for validation loss
  # eval_dataset_name: some_dataset
  # eval_dataset_config_name: main
  # eval_dataset_split: validation

# Benchmark evaluation (generation-based, runs during training)
benchmark_eval:
  enabled: true
  benchmark: gsm8k
  eval_steps: 500  # Run GSM8K accuracy eval every N steps
  num_samples: 100  # Use subset for faster eval during training
  max_new_tokens: 512
  batch_size: 8

training:
  output_dir: ./outputs/llama3-adalora
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  prediction_loss_only: true
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: adamw_torch_fused
  seed: 42
  dataloader_num_workers: 4
  report_to: wandb
  wandb_project: llama3-adalora-finetune
