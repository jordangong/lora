model:
  model_name_or_path: meta-llama/Meta-Llama-3-8B
  model_type: causal_lm
  torch_dtype: bfloat16
  trust_remote_code: false
  use_flash_attention_2: true
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  method: lora
  r: 64
  alpha: 16
  dropout: 0.1
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none

data:
  dataset_name: tatsu-lab/alpaca
  text_column: text
  max_seq_length: 2048
  preprocessing_num_workers: 4
  train_split: train
  # Option 1: Use holdout dataset for zero-shot eval
  eval_dataset_name: gsm8k
  eval_dataset_config_name: main
  eval_dataset_split: test
  # Option 2: Split training data (uncomment if no holdout dataset)
  # eval_split_ratio: 0.05

training:
  output_dir: ./outputs/llama3-4bit-lora
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 0.3
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: paged_adamw_32bit
  seed: 42
  dataloader_num_workers: 4
  report_to: wandb
  wandb_project: llama3-4bit-lora-finetune
