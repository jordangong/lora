model:
  model_name_or_path: meta-llama/Meta-Llama-3-8B
  model_type: causal_lm
  use_unsloth: false
  torch_dtype: bfloat16
  trust_remote_code: false
  use_flash_attention_2: true
  load_in_4bit: false
  load_in_8bit: false

lora:
  method: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none

data:
  dataset_name: trl-lib/ultrafeedback_binarized
  max_seq_length: 2048
  preprocessing_num_workers: 4
  train_split: train_prefs
  validation_split: test_prefs
  max_train_samples: 10000
  max_eval_samples: 1000

training:
  output_dir: ./outputs/llama3-dpo
  trainer_type: dpo
  llm_trainer: trl
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  eval_steps: 500
  eval_strategy: steps
  save_strategy: steps
  load_best_model_at_end: false
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: adamw_torch_fused
  seed: 42
  report_to: wandb
  wandb_project: llama3-dpo-finetune

dpo:
  beta: 0.1
  max_prompt_length: 1024
  max_completion_length: 1024
  max_length: 2048
  reference_free: false
  label_smoothing: 0.0
  disable_dropout: true

benchmark_eval:
  enabled: false
