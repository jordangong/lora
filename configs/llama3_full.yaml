# Full finetuning configuration for Llama 3
# All model parameters are trained (no PEFT adapter)
# Note: Requires significantly more GPU memory than LoRA

model:
  model_name_or_path: meta-llama/Meta-Llama-3-8B
  model_type: causal_lm
  torch_dtype: bfloat16
  trust_remote_code: false
  use_flash_attention_2: true
  # Full finetuning is NOT compatible with quantization
  load_in_4bit: false
  load_in_8bit: false

lora:
  method: full

data:
  dataset_name: tatsu-lab/alpaca
  text_column: text
  max_seq_length: 2048
  preprocessing_num_workers: 4
  train_split: train
  # For loss-based eval during training, use one of these options:
  # Option 1: Split training data for validation loss
  eval_split_ratio: 0.05
  # Option 2: Use a separate holdout dataset for validation loss
  # eval_dataset_name: some_dataset
  # eval_dataset_config_name: main
  # eval_dataset_split: validation

# Benchmark evaluation (generation-based, runs during training)
benchmark_eval:
  enabled: true
  tasks: gsm8k
  eval_steps: 500  # Run GSM8K accuracy eval every N steps
  num_samples: 100  # Use subset for faster eval during training
  max_new_tokens: 512
  batch_size: 8

training:
  output_dir: ./outputs/llama3-full
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  prediction_loss_only: true
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: adamw_torch_fused
  seed: 42
  dataloader_num_workers: 4
  report_to: wandb
  wandb_project: llama3-full-finetune
