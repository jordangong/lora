# IA3 (Infused Adapter by Inhibiting and Amplifying Inner Activations) for Llama 3
# IA3 is extremely parameter-efficient - learns only rescaling vectors
# Good for few-shot learning scenarios

model:
  model_name_or_path: meta-llama/Meta-Llama-3-8B
  model_type: causal_lm
  torch_dtype: bfloat16
  trust_remote_code: false
  use_flash_attention_2: true
  load_in_4bit: false
  load_in_8bit: false

lora:
  method: ia3
  target_modules:
    - k_proj
    - v_proj
    - down_proj
  feedforward_modules:
    - down_proj

data:
  dataset_name: tatsu-lab/alpaca
  text_column: text
  max_seq_length: 2048
  preprocessing_num_workers: 4
  train_split: train
  # Option 1: Use holdout dataset for zero-shot eval
  eval_dataset_name: gsm8k
  eval_dataset_config_name: main
  eval_dataset_split: test
  # Option 2: Split training data (uncomment if no holdout dataset)
  # eval_split_ratio: 0.05

training:
  output_dir: ./outputs/llama3-ia3
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: adamw_torch_fused
  seed: 42
  dataloader_num_workers: 4
  report_to: wandb
  wandb_project: llama3-ia3-finetune
