[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-finetune"
version = "0.1.0"
description = "LoRA finetuning for vision and language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["lora", "finetuning", "transformers", "peft", "llm", "vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "trl>=0.24.0",
    "accelerate>=0.25.0",
    "datasets>=2.16.0",
    "tokenizers>=0.15.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.4.0"]
bnb = ["bitsandbytes>=0.41.0"]
unsloth = ["unsloth"]
eval = ["lighteval>=0.13.0"]
all = ["flash-attn>=2.4.0", "bitsandbytes>=0.41.0", "unsloth", "lighteval>=0.13.0"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.scripts]
lora-train = "lora_finetune.train:main"

[project.urls]
Homepage = "https://github.com/yourusername/lora-finetune"
Repository = "https://github.com/yourusername/lora-finetune"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
# Default to CUDA 12.6. Override with: UV_INDEX=pytorch-cu128 uv sync
# Available: pytorch-cu126, pytorch-cu128, pytorch-cu130

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
